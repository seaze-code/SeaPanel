# SeaPanel Configuration
# Access the dashboard directly using your server IP:
# http://<server-ip>:<port>

web:
  # 0.0.0.0 listens on all network interfaces (recommended for server IP access)
  host: "0.0.0.0"
  port: 8080
  # Leave empty to auto-generate a secure password on first startup
  password: ""
  # Session token lifetime in hours
  session-hours: 24
  # Server display name shown in the dashboard navbar
  server-name: "Minecraft Server"
